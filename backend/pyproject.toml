[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offer-engine"
version = "0.1.0"
description = "Personalised Offer Engine: agentic, rule-guarded offer decisioning delivered over Telegram"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "apscheduler>=3.10,<4",
  "python-telegram-bot[job-queue,webhooks]>=21.6,<23",
  "groq>=0.11",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "faker>=26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pillow>=10.4",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
